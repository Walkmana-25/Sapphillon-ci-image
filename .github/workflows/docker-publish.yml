name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Convert repository name to lowercase
        id: repo_name
        run: echo "repository=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker (Linux)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo_name.outputs.repository }}
          tags: |
            type=ref,event=branch,suffix=-linux
            type=ref,event=pr,suffix=-linux
            type=sha,prefix=sha-,suffix=-linux
            type=raw,value=latest-linux,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image (Linux)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ steps.repo_name.outputs.repository }}:buildcache-linux
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ steps.repo_name.outputs.repository }}:buildcache-linux,mode=max

  build-and-push-windows:
    runs-on: windows-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Convert repository name to lowercase
        id: repo_name
        shell: powershell
        run: |
          $repo = "${{ github.repository }}".ToLower()
          echo "repository=$repo" >> $env:GITHUB_OUTPUT

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker (Windows)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo_name.outputs.repository }}
          tags: |
            type=ref,event=branch,suffix=-windows
            type=ref,event=pr,suffix=-windows
            type=sha,prefix=sha-,suffix=-windows
            type=raw,value=latest-windows,enable={{is_default_branch}}

      - name: Build and push Docker image (Windows)
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ steps.repo_name.outputs.repository }}:temp-windows -f Dockerfile.windows .
          $tags = "${{ steps.meta.outputs.tags }}" -split "`n"
          foreach ($tag in $tags) {
            $tag = $tag.Trim()
            if ($tag) {
              docker tag ${{ env.REGISTRY }}/${{ steps.repo_name.outputs.repository }}:temp-windows $tag
              docker push $tag
            }
          }
        shell: powershell
